name: 1. Secure CI Pipeline (Developer Branch)

# متى يشتغل هذا المسار؟
on:
  push:
    branches: [ "developer" ] # يشتغل تلقائياً عند رفع كود على برانش developer
  pull_request:
    branches: [ "main" ]      # يشتغل أيضاً عند طلب دمج الكود مع برانش main

permissions:
  contents: read

jobs:
  security-and-test:
    name: Security Scans (Secrets, SCA, SAST) & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # الخطوة 1: سحب ملفات مشروع saati_Store إلى السيرفر المؤقت
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # مهم جداً لأداة Gitleaks لفحص كل تاريخ الـ Commits

      # الخطوة 2: فحص الأسرار والمفاتيح المسربة (Secrets Scanning)
      - name: 2. Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # الخطوة 3: فحص المكتبات الخارجية في requirements.txt (SCA)
      - name: 3. Run Trivy for SCA (Dependency Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'sca-trivy-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # وضعناها 0 لكي يخرج لك التقرير حتى لو وجد ثغرة في المكتبات ولا يوقف المسار قبل حفظ التقرير

      # الخطوة 4: تجهيز لغة بايثون لتشغيل SAST والاختبارات
      - name: 4. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # الخطوة 5: فحص الكود المصدري لملفات Python و JS (SAST)
      - name: 5. Run Semgrep (SAST Scan)
        run: |
          pip install semgrep
          semgrep scan --config=auto --text --output=sast-semgrep-report.txt .

      # الخطوة 6: تثبيت مكتبات المشروع وتشغيل ملف الاختبارات test_saati_store.py
      - name: 6. Install Dependencies & Run Unit Tests
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest tests/test_saati_store.py || true

      # الخطوة 7: حفظ تقارير (SAST و SCA) كملفات قابلة للتحميل لتسليمها في الـ Deliverables
      - name: 7. Upload Security Reports (Deliverables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Security-Reports
          path: |
            sca-trivy-report.txt
            sast-semgrep-report.txt