name: Secure CI Pipeline (Develop Branch)

on:
  push:
    branches: [ "develop"]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-test:
    name: Security Scans (Secrets, SCA, SAST) & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Run Trivy for SCA (Dependency Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'sca-trivy-report.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 4. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 5. Run Semgrep (SAST Scan)
        run: |
          pip install semgrep
          semgrep scan --config=auto --text --output=sast-semgrep-report.txt . || true

      - name: 6. Install Dependencies & Run Unit Tests
        run: |
          pip install -r requirements.txt
          pip install pytest moto boto3
          pytest tests/test_saati_store.py || true

      - name: 7. Upload Security Reports (Deliverables)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-Security-Reports
          path: |
            sca-trivy-report.txt
            sast-semgrep-report.txt