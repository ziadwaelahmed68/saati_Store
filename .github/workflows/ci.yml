name: "CI — Verify, Security Scan & Test (develop)"

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-and-integration-tests:
    name: "Backend Tests (Pytest + Moto)"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: pytest -v

  docker-build-check:
    name: "Build Matrix — Docker Services"
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: backend/services/auth/Dockerfile
          - service: products
            dockerfile: backend/services/products/Dockerfile
          - service: images
            dockerfile: backend/services/images/Dockerfile
          - service: orders
            dockerfile: backend/services/orders/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: saati-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
