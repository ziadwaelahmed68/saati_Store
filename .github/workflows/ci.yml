name: CI Pipeline (Security & Build Check)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scans:
    name: Security Scans (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Scanning (TruffleHog)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/trufflesecurity/trufflehog:latest filesystem . --fail

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app.py

      - name: Dependency Security Scan (Safety)
        run: |
          pip install safety
          safety check -r backend/requirements.txt

  test-build:
    needs: security-scans
    name: Dry-Run Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        run: |
          cd backend
          docker build -t saati-backend:test .
