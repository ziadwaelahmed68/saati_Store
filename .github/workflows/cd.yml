name: Secure CD Pipeline (Main Branch)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # مطلوب لتشغيل AWS IAM Role (OIDC) ولتوقيع Cosign

jobs:
  build-sign-deploy-dast:
    name: Build, Artifact Signing, IAM Role, DAST & AWS Push
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Production Code
        uses: actions/checkout@v4

      # الشرط 1: IAM roles for pipelines
      - name: 2. Configure AWS Credentials via IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # تأكد من إضافة هذا الـ Secret في إعدادات مستودع جيتهاب
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      # --- الخطوات الجديدة الخاصة بـ AWS ---
      - name: 3. Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build, tag, and push Docker image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # استبدل saati-frontend باسم الـ Repository الذي أنشأته في AWS ECR
          ECR_REPOSITORY: saati-frontend 
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # بناء الصورة
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f ./frontend/Dockerfile .
          # رفع الصورة إلى AWS ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # حفظ اسم الصورة لاستخدامه في خطوات التوقيع
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # الشرط 2: Artifact signing (Cosign)
      - name: 5. Install Cosign for Artifact Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: 6. Sign Docker Artifact (Keyless OIDC Signing)
        run: |
          # توقيع الصورة المرفوعة على AWS ECR
          cosign sign --yes ${{ steps.build-image.outputs.image }}

     # تشغيل حاوية الموقع التي بنيناها للتو لتكون جاهزة لفحص الـ DAST
      - name: 7. Start Application Container for DAST Scanning
        run: |
          # إضافة --add-host لمنع Nginx من الانهيار بسبب عدم وجود حاويات الباك إند
          docker run -d -p 8080:8080 \
            --add-host auth:127.0.0.1 \
            --add-host products:127.0.0.1 \
            --add-host images:127.0.0.1 \
            --add-host orders:127.0.0.1 \
            --name saati_staging ${{ steps.build-image.outputs.image }}
          
          # الانتظار قليلاً للتأكد من أن الحاوية بدأت بالعمل
          sleep 5
          
          # إعطاء صلاحيات الكتابة لمجلد المشروع حتى يتمكن ZAP من حفظ التقارير
          chmod -R 777 ${{ github.workspace }}
          
          # عرض سجلات الحاوية (Logs) لاكتشاف أي خطأ في حالة سقوطها
          docker logs saati_staging
          
          # اختبار الاتصال (بدون || true عشان لو وقعت نعرف فوراً في الخطوة دي)
          curl -I http://localhost:8080
      # الشرط 3: DAST & DAST results (OWASP ZAP)
      - name: 8. Run OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          cmd_options: '-a'
          allow_issue_writing: false # يمنع الخطأ الناتج عن محاولة فتح Issue
          fail_action: false          # يضمن خروج التقرير بنجاح باللون الأخضر
