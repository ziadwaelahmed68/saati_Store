name: "CD — Build & Deploy to AWS (main)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'saati-store-cluster' }}

jobs:
  pre-deploy-checks:
    name: "Pre-Deploy Tests & Security Gate"
    runs-on: ubuntu-latest
    outputs:
      aws_configured: ${{ steps.check-aws.outputs.configured }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & run tests
        run: |
          pip install -r requirements.txt
          pytest -v

      - name: Check AWS credentials availability
        id: check-aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [[ -n "$AWS_ACCESS_KEY_ID" || -n "$AWS_ROLE_TO_ASSUME" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-to-aws:
    name: "Push to ECR & Update ECS (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    environment: production
    # يتخطى الرفع لو لسه محطتش مفاتيح AWS في GitHub Secrets عشان الـ Pipeline ميفشلش في البداية
    if: needs.pre-deploy-checks.outputs.aws_configured == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            dockerfile: backend/services/auth/Dockerfile
          - service: products
            dockerfile: backend/services/products/Dockerfile
          - service: images
            dockerfile: backend/services/images/Dockerfile
          - service: orders
            dockerfile: backend/services/orders/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: saati-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-repositories --repository-names "$REPOSITORY" || \
            aws ecr create-repository --repository-name "$REPOSITORY" --image-scanning-configuration scanOnPush=true
          docker build -f ${{ matrix.dockerfile }} -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Trigger ECS Rolling Deployment (if service exists)
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "saati-${{ matrix.service }}" | grep -q "ACTIVE" && \
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "saati-${{ matrix.service }}" --force-new-deployment || \
            echo "ECS service saati-${{ matrix.service }} not provisioned yet; image pushed to ECR."