name: Secure CD Pipeline (Main Branch)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write # مطلوب لتشغيل AWS IAM Role (OIDC) ولتوقيع Cosign

jobs:
  build-sign-deploy-dast:
    name: Build, Artifact Signing, IAM Role & DAST
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Production Code
        uses: actions/checkout@v4

      # الشرط 1: IAM roles for pipelines (الاتصال بـ AWS عبر OIDC)
      - name: 2. Configure AWS Credentials via IAM Role
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true # حتى لا يتوقف المسار لو لم تكن قد ربطت حساب AWS بعد
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::123456789012:role/GitHubActions-CD-Role' }}
          aws-region: us-east-1

      # تجهيز وبناء Docker Image للمشروع
      - name: 3. Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and Push Frontend Docker Artifact
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/saati-frontend:latest

      # الشرط 2: Artifact signing (توقيع الـ Docker Image باستخدام Cosign)
      - name: 5. Install Cosign for Artifact Signing
        uses: sigstore/cosign-installer@v3.5.0

      - name: 6. Sign Docker Artifact (Keyless OIDC Signing)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/saati-frontend@${{ steps.build-image.outputs.digest }}

      # تشغيل التطبيق محلياً داخل السيرفر لاختباره بـ DAST
      - name: 7. Start Application for DAST Scanning
        run: |
          pip install -r requirements.txt
          nohup python app.py > app.log 2>&1 &
          sleep 5

      # الشرط 3: DAST & DAST results (فحص التطبيق وهو يعمل بواسطة OWASP ZAP)
      - name: 8. Run OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000'
          fail_action: false