server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/signup { proxy_pass http://auth:8081; }
    location /api/signin { proxy_pass http://auth:8081; }
    location /api/signout { proxy_pass http://auth:8081; }
    location /api/me { proxy_pass http://auth:8081; }

    location /api/products { proxy_pass http://products:8082; }
    location /api/admin/products { proxy_pass http://products:8082; }

    location /api/admin/images { proxy_pass http://images:8083; }

    location /api/checkout { proxy_pass http://orders:8084; }
    location /api/orders { proxy_pass http://orders:8084; }
    location /api/admin/orders { proxy_pass http://orders:8084; }
    location /api/admin/stats { proxy_pass http://orders:8084; }

    # SPA fallback so manual entry of /admin serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}